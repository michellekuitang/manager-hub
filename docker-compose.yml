# Environnement de developpement local.
# Les valeurs sensibles ne sont pas ecrites ici : elles sont lues depuis
# backend/.env, qui n'est pas versionne. Voir backend/.env.example pour la
# liste des variables attendues.

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file:
      - ./backend/.env
    environment:
      # L'hote "mongo" est le nom du service ci-dessous : il n'est resolvable
      # qu'a l'interieur du reseau Docker. Cette valeur ecrase donc celle du
      # fichier .env, qui pointe sur localhost pour les scripts lances depuis
      # la machine hote.
      # - MONGO_URI=mongodb://mongo:27017/managerhub
      - CORS_ORIGINS=http://localhost:3000
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: